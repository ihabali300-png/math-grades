name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: apk, cancel-in-progress: true }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Bundle web files into the APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html sw.js manifest.json version.json icon-192.png icon-512.png icon-maskable.png lib android/app/src/main/assets/www/
      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk Grades.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: سجل الدرجات APK ${{ github.run_number }}
          files: Grades.apk
          make_latest: true
