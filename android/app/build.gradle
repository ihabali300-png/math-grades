plugins { id 'com.android.application' }
android {
    namespace 'com.ihab.grades'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ihab.grades'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '1.4'
        buildConfigField 'String', 'APP_URL', '"https://ihabali300-png.github.io/math-grades/"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release { storeFile file('release.keystore'); storePassword 'grades2027'; keyAlias 'grades'; keyPassword 'grades2027' }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
